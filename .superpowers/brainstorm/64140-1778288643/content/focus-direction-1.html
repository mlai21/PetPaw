<h2>这轮 UI 先打磨哪个方向？</h2>
<p class="subtitle">先聚焦一个主方向，能更快做出可感知提升。</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>顾问聊天体验优先</h3>
      <p>重点优化消息层级、输入区、思考态、快捷建议与沉浸感。</p>
    </div>
  </div>

  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>今日页行动闭环优先</h3>
      <p>重点优化晨间记录、今日挑战卡片、完成反馈与视觉节奏。</p>
    </div>
  </div>

  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>整体信息架构与导航优先</h3>
      <p>重点优化底部导航、页面层级、悬浮分身入口与全局一致性。</p>
    </div>
  </div>
</div>
